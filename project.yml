name: Portmaster
options:
  bundleIdPrefix: dev.portmaster
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  PortmasterCore:
    path: Core

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    PORTMASTER_UPDATE_FEED_URL: ""
    PORTMASTER_UPDATE_PUBLIC_KEY: ""
    DEAD_CODE_STRIPPING: "YES"

targets:
  Portmaster:
    type: application
    platform: macOS
    sources:
      - path: App
      #
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: PortmasterCore
        product: PortmasterCore
      # The app hosts the MCP server itself (App/MCPHostController.swift), so it
      # links the module the CLI is built from rather than a second copy of it.
      - package: PortmasterCore
        product: PortmasterMCP
      # The client-side half of the MCP feature, shipped inside the app.
      #
      # Settings → MCP offers a "Copy install command" button, and a button that names a
      # path only the build machine has is a button no real user can press: a checkout
      # lookup (#filePath) resolves on the machine that compiled the app and nowhere else.
      # So the executable travels with it, in Contents/Resources, which is where
      # `MCPInstallCommand.binaryCandidates` looks first.
      #
      # Declared as a dependency so Xcode *builds* the executable and links its output into
      # this target's products directory, and with `link: false` because an executable
      # cannot be linked against — only copied. The copy itself is the post-build script
      # below, not an Xcode Copy Files phase: see the comment on it.
      - package: PortmasterCore
        product: portmaster-mcp
        link: false
    # Copy the built CLI into Contents/Resources, by the post-build script below
      # (`scripts/embed-mcp-cli.sh`, whose header explains why it is a script and not an
      # Xcode Copy Files phase — one was tried and abandoned).
      # The script copies what Xcode built — it never invokes `swift build`, so it takes no
      # SwiftPM build lock and does not make an app build depend on the toolchain.
    postBuildScripts:
      - path: scripts/embed-mcp-cli.sh
        name: Embed portmaster-mcp
        basedOnDependencyAnalysis: false
        showEnvVars: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.portmaster.app
        PRODUCT_NAME: Portmaster
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Portmaster.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Support/Portmaster-Debug.entitlements
